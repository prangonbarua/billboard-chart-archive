<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versus &middot; {{ chart.label }}</title>
    {% include '_head_styles.html' %}
    <style>
    .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; }
    .page-meta { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }

    .page-head { display: flex; align-items: flex-start; justify-content: space-between;
                 gap: 1rem; flex-wrap: wrap; }
    .dl-csv {
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text) !important; text-decoration: none;
        font-size: 0.8125rem; font-weight: 600; padding: 0.5rem 0.875rem;
        white-space: nowrap; margin-top: 0.25rem;
    }
    .dl-csv:hover { background: var(--surface-hover); }
    .dl-csv[hidden] { display: none; }

    .picker { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
              margin: 1.5rem 0; }
    .picker select, .picker input {
        font-family: inherit; font-size: 0.875rem; padding: 0.5rem 0.75rem;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text); border-radius: 0;
    }
    .picker input { min-width: 220px; }
    .picker button {
        font-family: inherit; font-size: 0.875rem; font-weight: 500;
        padding: 0.5rem 1rem; border: 1px solid var(--border-accent);
        background: var(--border-accent); color: #ffffff !important; cursor: pointer;
        border-radius: 0;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    .chip { display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.375rem 0.75rem; border: 1px solid var(--border);
            font-size: 0.875rem; }
    .chip button { border: 0; background: none; color: var(--text-muted);
                   cursor: pointer; font-family: inherit; font-size: 1rem;
                   line-height: 1; padding: 0; }
    .chip .swatch { width: 10px; height: 10px; display: inline-block; }

    /* Many artists scroll horizontally rather than crushing the layout. */
    .scorecard-wrap { overflow-x: auto; }
    table.scorecard { border-collapse: collapse; width: 100%; min-width: 480px; }
    .scorecard th, .scorecard td {
        text-align: right; padding: 0.6875rem 1rem; font-size: 0.9375rem;
        border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .scorecard th:first-child, .scorecard td:first-child {
        text-align: left; color: var(--text-muted); font-weight: 500;
    }
    .scorecard thead th { font-weight: 600; color: var(--text); }
    .scorecard td.best { background: var(--surface-active); font-weight: 600; }
    .empty { color: var(--text-muted); padding: 2rem 0; }

    .graph-wrap { overflow-x: auto; margin: 1.5rem 0 2rem; }
    .graph { display: block; width: 100%; height: auto; }
    .graph .axis { stroke: var(--border); stroke-width: 1; }
    .graph .tick { fill: var(--text-muted); font-size: 11px; }
    .graph .series { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .graph .series.dim, .graph .dot.dim { opacity: 0.15; }
    /* Invisible fat stroke under each line: a 2px path is not a hit target. */
    .graph .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
    .legend { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.875rem; }
    .legend span { display: inline-flex; align-items: center; gap: 0.375rem;
                   cursor: pointer; }
    .legend span.pinned { font-weight: 600; text-decoration: underline; }
    .legend i { width: 14px; height: 3px; display: inline-block; }
    </style>
    <link rel="stylesheet" href="/static/paxel.css">
</head>
<body>
{% include '_nav.html' %}

<div class="wrap">
    <div class="page-head">
        <div>
            <h1>Versus</h1>
            <div class="page-meta">Compare artists on {{ chart.label }}</div>
        </div>
        <a class="dl-csv" id="dl-csv" href="/download-versus-csv" hidden>Download CSV</a>
    </div>

    <form class="picker" id="picker" autocomplete="off">
        <select id="chart" name="chart">
            {% for group, items in charts.items() %}
            <optgroup label="{{ group }}">
                {% for c in items %}
                <option value="{{ c.key }}" {{ 'selected' if c.key == chart_key else '' }}>{{ c.label }}</option>
                {% endfor %}
            </optgroup>
            {% endfor %}
        </select>
        <input id="artist" list="artist-options" placeholder="Add an artist">
        <datalist id="artist-options"></datalist>
        <button type="submit">Add</button>
    </form>

    <div class="chips" id="chips"></div>
    <div id="graph"></div>
    <div class="scorecard-wrap"><div id="scorecard"></div></div>
</div>

<script>
const CHART_KEY = {{ chart_key|tojson }};
const INITIAL   = {{ initial_artists|tojson }};

// Cycling palette. Distinct hues are required to tell series apart; validated
// against validate_palette.js (lightness band, chroma floor, CVD separation,
// normal-vision floor, contrast) in light mode.
const PALETTE = ['#059669', '#dc2626', '#2563eb', '#d97706', '#9333ea', '#0891b2'];
const colorFor = i => PALETTE[i % PALETTE.length];

let artists = INITIAL.slice();

// All state in the URL: shareable, and back/forward works. User-driven
// changes push a new history entry; restoring from the URL (initial load,
// popstate) replaces instead, so Back doesn't fight itself.
function syncUrl(push) {
    const q = new URLSearchParams();
    q.set('chart', document.getElementById('chart').value);
    if (artists.length) q.set('artists', artists.join('|'));
    const url = '/versus?' + q.toString();
    if (push) history.pushState(null, '', url);
    else history.replaceState(null, '', url);
}

// The download takes the same query the API does, so it always exports the
// comparison currently on screen. Hidden outright when there is nothing to
// export rather than linking to a 400.
function syncCsvLink() {
    const link = document.getElementById('dl-csv');
    if (!artists.length) { link.hidden = true; return; }
    const q = new URLSearchParams();
    q.set('chart', document.getElementById('chart').value);
    q.set('artists', artists.join('|'));
    link.href = '/download-versus-csv?' + q.toString();
    link.hidden = false;
}

function renderChips() {
    document.getElementById('chips').innerHTML = artists.map((a, i) =>
        `<span class="chip"><span class="swatch" style="background:${colorFor(i)}"></span>`
        + `${escapeHtml(a)}<button type="button" data-i="${i}" aria-label="Remove">&times;</button></span>`
    ).join('');
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const ROWS = [
    ['Entries',            a => a.entries,             'high'],
    ['Number ones',        a => a.number_ones,         'high'],
    ['Weeks at #1',        a => a.weeks_at_1,          'high'],
    ['Top 10s',            a => a.top_10s,             'high'],
    ['Top 40s',            a => a.top_40s,             'high'],
    ['Best peak',          a => a.best_peak,           'low'],
    ['Weeks charted',      a => a.total_weeks_charted, 'high'],
    ['First entry',        a => a.first_entry,         null],
    ['Last entry',         a => a.last_entry,          null],
    ['Biggest hit',        a => a.biggest_hit,         null],
];

function renderScorecard(data) {
    const list = data.artists;
    if (!list.length) {
        // One artist renders a full scorecard, so this must not ask for two.
        showMessage('Add an artist to see their record, or several to compare.');
        return;
    }
    const head = '<tr><th></th>' + list.map(a =>
        `<th>${escapeHtml(a.display_name)}</th>`).join('') + '</tr>';

    const body = ROWS.map(([label, get, better]) => {
        const vals = list.map(get);
        const best = new Set();
        if (better) {
            const nums = vals.map(v => (typeof v === 'number' ? v : null));
            const real = nums.filter(v => v !== null);
            if (real.length) {
                const target = better === 'high' ? Math.max(...real) : Math.min(...real);
                nums.forEach((v, i) => { if (v === target) best.add(i); });
            }
        }
        const cells = vals.map((v, i) =>
            `<td class="${best.has(i) ? 'best' : ''}">${v === null || v === undefined ? '&mdash;' : escapeHtml(v)}</td>`
        ).join('');
        return `<tr><td>${label}</td>${cells}</tr>`;
    }).join('');

    document.getElementById('scorecard').innerHTML =
        `<table class="scorecard"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

// Hand-rolled SVG. Y is rank, inverted so #1 sits at the top, scaled to the
// chart's depth. Weeks an artist did not chart break the line rather than
// interpolating across the gap, which would imply chart presence that did not
// exist.
window.renderGraph = function (data) {
    const host = document.getElementById('graph');
    const series = data.artists.filter(a => a.timeline.length);
    if (!series.length) { host.innerHTML = ''; return; }

    const W = 1040, H = 420, M = {t: 16, r: 16, b: 28, l: 40};

    // Long careers run 600-950+ charted weeks; across many artists (this page
    // supports unlimited artists) the combined timeline can be tens of
    // thousands of points, well past the ~65,536-argument ceiling for
    // Math.min/max(...spread) — a loop avoids that RangeError entirely.
    // The same loop finds the deepest rank actually present in the data:
    // three charts (adult_contemporary, digital, radio) carry historical
    // ranks deeper than their registry `depth` (the MODERN depth), so
    // scaling to `depth` alone would clip real points off the bottom of
    // the graph with no visual indication anything was cut.
    let t0 = Infinity, t1 = -Infinity, depth = data.chart.depth;
    for (const a of series) {
        for (const p of a.timeline) {
            const t = Date.parse(p.date);
            if (t < t0) t0 = t;
            if (t > t1) t1 = t;
            if (p.rank > depth) depth = p.rank;
        }
    }
    const spanX = (t1 - t0) || 1;

    const x = t => M.l + ((t - t0) / spanX) * (W - M.l - M.r);
    const y = r => M.t + ((r - 1) / Math.max(depth - 1, 1)) * (H - M.t - M.b);

    // A gap longer than 10 days means at least one missed week: break the path.
    const GAP_MS = 10 * 864e5;
    const pathFor = tl => {
        let d = '', prev = null;
        for (const p of tl) {
            const t = Date.parse(p.date);
            d += (prev === null || t - prev > GAP_MS ? 'M' : 'L')
               + x(t).toFixed(1) + ' ' + y(p.rank).toFixed(1) + ' ';
            prev = t;
        }
        return d.trim();
    };

    // A point that starts a new subpath (gap before it, or it's the first
    // point) AND has a gap after it too (or is the last point) draws no line
    // segment on either side — a bare path renders nothing for it. Give only
    // those isolated points a dot so a one-week run is still visible; a point
    // with a neighbour on either side already has a drawn segment.
    const isolatedDots = (tl, color, name) => {
        const startsNewSubpath = j => j === 0
            || Date.parse(tl[j].date) - Date.parse(tl[j - 1].date) > GAP_MS;
        return tl
            .filter((p, j) => startsNewSubpath(j) && (j === tl.length - 1 || startsNewSubpath(j + 1)))
            .map(p => `<circle class="dot" data-name="${name}" r="3.5" `
                + `cx="${x(Date.parse(p.date)).toFixed(1)}" cy="${y(p.rank).toFixed(1)}" `
                + `fill="${color}"></circle>`)
            .join('');
    };

    const rankTicks = [1, ...[10, 25, 50, 100, 200].filter(r => r < depth), depth];
    const yAxis = rankTicks.map(r =>
        `<text class="tick" x="${M.l - 8}" y="${y(r) + 4}" text-anchor="end">${r}</text>`
    ).join('');

    // Six evenly spaced year labels read fine across a multi-year span, but a
    // span under a year prints the same year six times over (or, when
    // t0 === t1, spreads sub-millisecond-apart samples across the whole
    // width, all showing one year) — de-dupe, and collapse under a year to
    // one centered label instead of inventing month/quarter ticks.
    const yearOf = t => new Date(t).getUTCFullYear();
    const spanDays = (t1 - t0) / 864e5;
    let years;
    if (spanDays < 365) {
        const mid = (t0 + t1) / 2;
        years = `<text class="tick" x="${x(mid).toFixed(1)}" y="${H - 8}" `
            + `text-anchor="middle">${yearOf(mid)}</text>`;
    } else {
        const seen = new Set();
        years = '';
        for (let s = 0; s < 6; s++) {
            const t = t0 + (spanX * s) / 5;
            const yr = yearOf(t);
            if (seen.has(yr)) continue;
            seen.add(yr);
            years += `<text class="tick" x="${x(t).toFixed(1)}" y="${H - 8}" `
                + `text-anchor="middle">${yr}</text>`;
        }
    }

    // Hit paths first so every one of them sits under every visible line;
    // otherwise a later series' invisible stroke would swallow hovers meant
    // for an earlier series' painted one.
    const hits = series.map(a =>
        `<path class="hit" data-name="${escapeHtml(a.name)}" `
        + `d="${pathFor(a.timeline)}"></path>`).join('');

    const lines = series.map(a => {
        const color = colorFor(data.artists.indexOf(a));
        const name = escapeHtml(a.name);
        return `<path class="series" data-name="${name}" `
            + `stroke="${color}" d="${pathFor(a.timeline)}"></path>`
            + isolatedDots(a.timeline, color, name);
    }).join('');

    host.innerHTML = `
      <div class="graph-wrap">
        <svg class="graph" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
             role="img" aria-label="Chart rank over time">
          <line class="axis" x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H - M.b}"></line>
          <line class="axis" x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}"></line>
          ${yAxis}${years}${hits}${lines}
        </svg>
      </div>
      <div class="legend">${series.map(a =>
        `<span data-name="${escapeHtml(a.name)}">`
        + `<i style="background:${colorFor(data.artists.indexOf(a))}"></i>`
        + `${escapeHtml(a.display_name)}</span>`).join('')}
      </div>`;

    // Hovering a legend entry or a line isolates it and dims the rest. Dots
    // are selected alongside paths so an isolated point dims in lockstep with
    // its own line; matching is by each element's own data-name attribute,
    // not positional index, so interleaving circles with paths in document
    // order cannot shift another artist's dim target.
    const paths = host.querySelectorAll('.series, .dot');
    const legend = host.querySelectorAll('.legend span');
    const isolate = name => paths.forEach(p =>
        p.classList.toggle('dim', name !== null && p.dataset.name !== name));

    // Hover alone would make this desktop-only, while the legend's pointer
    // cursor advertises it everywhere. Clicking or tapping pins the isolation
    // instead, and a pin outranks hover until it is cleared.
    let pinned = null;
    const pin = name => {
        pinned = pinned === name ? null : name;
        legend.forEach(s => s.classList.toggle('pinned', s.dataset.name === pinned));
        isolate(pinned);
    };
    host.querySelectorAll('.legend span, .hit').forEach(el => {
        el.addEventListener('mouseenter', () => { if (!pinned) isolate(el.dataset.name); });
        el.addEventListener('mouseleave', () => { if (!pinned) isolate(null); });
        el.addEventListener('click', () => pin(el.dataset.name));
    });
};

function showMessage(text) {
    document.getElementById('scorecard').innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    document.getElementById('graph').innerHTML = '';
}

// Every load takes a token. The chips and the URL update synchronously while
// the fetch is in flight, so without this a slow response landing after a
// faster later one would repaint the scorecard and graph for an artist set
// the chips no longer show — reachable with rapid Back-Back.
let loadToken = 0;

// push: whether this render should add a history entry (a user-driven
// change) or replace the current one (initial load, popstate restore).
async function load(push) {
    const token = ++loadToken;
    renderChips();
    syncCsvLink();
    syncUrl(push);
    if (!artists.length) {
        renderScorecard({artists: []});
        document.getElementById('graph').innerHTML = '';
        return;
    }
    const chart = document.getElementById('chart').value;
    let data;
    try {
        const res = await fetch(`/api/versus?chart=${encodeURIComponent(chart)}`
            + `&artists=${encodeURIComponent(artists.join('|'))}`);
        if (!res.ok) throw new Error(res.status);
        data = await res.json();
    } catch (err) {
        // Returning silently would leave the previous comparison on screen
        // under the new chips, reading as if it were the requested one.
        if (token === loadToken) showMessage('Could not load this comparison.');
        return;
    }
    if (token !== loadToken) return;
    renderScorecard(data);
    if (window.renderGraph) window.renderGraph(data);
}

document.getElementById('picker').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('artist');
    const name = input.value.trim();
    // Case-insensitive, consistent with the server's dedupe in
    // _parse_artist_list: typing 'drake' then 'Drake' is the same comparison
    // twice, not two artists, and would otherwise draw two overlapping chips,
    // scorecard columns, and lines for the same person.
    const isDuplicate = name && artists.some(a => a.toLowerCase() === name.toLowerCase());
    if (name && !isDuplicate) { artists.push(name); load(true); }
    input.value = '';
});

document.getElementById('chips').addEventListener('click', e => {
    const btn = e.target.closest('button[data-i]');
    if (!btn) return;
    artists.splice(Number(btn.dataset.i), 1);
    load(true);
});

document.getElementById('chart').addEventListener('change', () => load(true));

// Back/forward: restore chart + artists from the URL and re-render (chips
// included) without pushing another entry, or Back would fight itself.
window.addEventListener('popstate', () => {
    const p = new URLSearchParams(location.search);
    document.getElementById('chart').value = p.get('chart') || CHART_KEY;
    artists = (p.get('artists') || '').split('|').filter(Boolean);
    load(false);
});

// Autocomplete against the selected chart's own artist pool. Debounced so
// typing a name is one request rather than one per keystroke, and tokened so
// a slow early response cannot overwrite the suggestions for what is in the
// box now.
let suggestTimer = null;
let suggestToken = 0;

async function suggest(q) {
    const token = ++suggestToken;
    const chart = document.getElementById('chart').value;
    try {
        const res = await fetch(`/api/artists?chart=${encodeURIComponent(chart)}`
            + `&q=${encodeURIComponent(q)}`);
        if (!res.ok) return;
        const {artists: opts} = await res.json();
        if (token !== suggestToken) return;
        document.getElementById('artist-options').innerHTML =
            opts.map(a => `<option value="${escapeHtml(a)}">`).join('');
    } catch (err) {
        /* suggestions are optional; typing the name still works */
    }
}

document.getElementById('artist').addEventListener('input', e => {
    const q = e.target.value.trim();
    clearTimeout(suggestTimer);
    if (q.length < 2) return;
    suggestTimer = setTimeout(() => suggest(q), 150);
});

load(false);   // initial render from the URL we arrived on; don't push
</script>
</body>
</html>
