name: Weekly chart update

on:
  schedule:
    # Billboard publishes new charts on Tuesdays; run Wednesday 13:00 UTC
    - cron: "0 13 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From requirements.txt, not a floating `pip install pandas`: the
      # scraper's output depends on pandas behaviour, and this run's pandas
      # should be the one production actually serves the data with.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape latest charts
        run: python3 scripts/fast_billboard_scraper.py

      # Billboard serves an out-of-range date by re-sending the boundary
      # week's rankings under the requested date, so a fabricated week looks
      # valid on its own and only shows up against its neighbour. Running the
      # scraper by hand has produced exactly that. Weeks already triaged are
      # in scripts/known_clamped_weeks.json; this fails only on new ones, and
      # fails before the commit step so bad rows are never pushed.
      - name: Verify scraped data
        run: python3 scripts/verify_charts.py

      - name: Commit updated data
        id: commit
        run: |
          git add data/hot100.csv data/billboard200.csv data/global200.csv data/globalexus.csv data/radio.csv data/digital_songs.csv data/streaming_songs.csv data/artist100.csv data/pop_airplay.csv data/adult_contemporary.csv data/adult_pop_airplay.csv data/rhythmic_airplay.csv data/country_airplay.csv data/alternative_airplay.csv data/rnb_hiphop_airplay.csv data/dance_airplay.csv data/adult_rnb_airplay.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new chart data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update chart data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Railway
        if: steps.commit.outputs.changed == 'true' && env.HAS_RAILWAY_TOKEN == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --service billboard-chart-archive --detach
